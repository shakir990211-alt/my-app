<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Payment Methods | Amazon Clone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div id="nav"></div>
<main class="container main" style="max-width:700px">
  <h2 class="page-title">My Payment Methods</h2>
  <p class="helper">Demo mode only — no real cards are stored and no charges are made.</p>
  <div class="section">
    <h3>Saved Payment Methods</h3>
    <div id="payList"></div>
  </div>
  <div class="section" style="margin-top:16px">
    <h3>Add a Payment Method</h3>
    <form id="payForm">
      <div class="form-row">
        <div class="form-group"><label>Type</label><select class="form-control" name="type"><option>Credit Card</option><option>Debit Card</option></select></div>
        <div class="form-group"><label>Last 4 Digits</label><input type="text" class="form-control" name="last4" maxlength="4" required></div>
        <div class="form-group"><label>Expiry (MM/YY)</label><input type="text" class="form-control" name="expiry" placeholder="12/28" required></div>
      </div>
      <div class="btn-group"><button type="submit" class="btn btn-orange">Save</button></div>
      <div id="payMsg" class="helper" style="margin-top:10px"></div>
    </form>
  </div>
</main>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
async function load(){
  try { requireAuth(); } catch {}
  try {
    const { paymentMethods } = await paymentApi.list();
    const el = document.getElementById('payList');
    if (!paymentMethods.length) { el.innerHTML = '<div class="helper">No payment methods saved.</div>'; return; }
    el.innerHTML = paymentMethods.map(p => `<div style="border:1px solid #ddd;border-radius:4px;padding:12px;margin:10px 0;display:flex;justify-content:space-between"><div><b>${esc(p.type)}</b> &#8226;&#8226;&#8226;&#8226;${esc(p.last4)}<br>Expires ${esc(p.expiry)} ${p.is_default ? ' <span class="badge badge-processing">Default</span>' : ''}</div><div><button class="remove-btn" onclick="removePay(${p.id})">Remove</button></div></div>`).join('');
  } catch (e) {
    if (/401|403/.test(e.message)) location.href = '/login.html';
    else alert(e.message);
  }
}
async function removePay(id){
  if (!confirm('Remove this payment method?')) return;
  await paymentApi.remove(id);
  load();
}
document.getElementById('payForm').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await paymentApi.add({ type: fd.get('type'), last4: fd.get('last4'), expiry: fd.get('expiry') });
    document.getElementById('payMsg').textContent = 'Payment method saved (demo).';
    document.getElementById('payForm').reset();
    load();
  } catch (e) { document.getElementById('payMsg').textContent = e.message; document.getElementById('payMsg').style.color = '#b12704'; }
};
load();
</script>
</body>
</html>
