<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Results | Amazon Clone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div id="nav"></div>
<main class="container main">
  <h2 class="page-title" id="searchHeading">Search Results</h2>
  <div class="category-pills" id="categoryPills"></div>
  <div class="product-grid" id="productGrid"></div>
</main>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
const EMOJI = { Electronics:'📱', Mobiles:'📱', Fashion:'👕', 'Home & Kitchen':'🏠', Beauty:'💄', Sports:'🏀', Toys:'🧸', Books:'📚', Grocery:'🥑' };
function emojiFor(c){ return EMOJI[c] || '📦'; }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
function cardHtml(p){
  return `<div class="product-card" style="cursor:pointer" onclick="location.href='/product/${p.id}'">
    <div class="product-image">${emojiFor(p.category)}</div>
    <div class="product-title">${esc(p.title)}</div>
    <div class="product-rating">★ ${p.rating} (${p.reviews_count || 0})</div>
    <div class="product-price">${formatPrice(p.price)}</div>
    <button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${p.id})">Add to Cart</button>
  </div>`;
}
const params = new URLSearchParams(location.search);
const category = params.get('category') || '';
const q = params.get('q') || '';
async function load(){
  const heading = document.getElementById('searchHeading');
  const grid = document.getElementById('productGrid');
  const pills = document.getElementById('categoryPills');
  const cats = ['Electronics','Mobiles','Fashion','Home & Kitchen','Beauty','Sports','Toys','Books','Grocery'];
  pills.innerHTML = cats.map(c => `<span class="pill ${category===c?'active':''}" onclick="location.href='/search.html?category=' + encodeURIComponent('${esc(c)}')">${esc(c)}</span>`).join('');
  try {
    let data;
    if (q) { data = await productApi.search(q); heading.textContent = `Search results for "${esc(q)}"`; }
    else { data = await productApi.list({ category, limit: 50 }); heading.textContent = category ? category + ' products' : 'All products'; }
    const products = data.products || [];
    grid.innerHTML = products.length ? products.map(cardHtml).join('') : '<div class="empty-state"><h2>No products found</h2></div>';
  } catch (e) {
    grid.innerHTML = '<div class="empty-state"><h2>Unable to load products</h2></div>';
  }
}
async function addToCart(id){
  try {
    await cartApi.add({ product_id: id, quantity: 1 });
    showToast('Added to cart');
    const c = await cartApi.get();
    document.getElementById('cartCount').textContent = (c.cart || []).length;
  } catch (e) { alert(e.message); }
}
load();
</script>
</body>
</html>
