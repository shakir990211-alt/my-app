<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Amazon Clone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div id="nav"></div>
<main class="container main">
  <h2 class="page-title">Shopping Cart</h2>
  <div id="cartItems"></div>
  <div class="cart-summary" id="summary"></div>
</main>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
function emojiFor(c){ const m = { Electronics:'📱', Mobiles:'📱', Fashion:'👕', 'Home & Kitchen':'🏠', Beauty:'💄', Sports:'🏀', Toys:'🧸', Books:'📚', Grocery:'🥑' }; return m[c] || '📦'; }
async function load(){
  try { requireAuth(); } catch {}
  try {
    const { cart } = await cartApi.get();
    const el = document.getElementById('cartItems');
    const summary = document.getElementById('summary');
    if (!cart.length) {
      el.innerHTML = '<div class="empty-state"><h2>Your cart is empty</h2><a href="/" class="btn btn-orange">Start Shopping</a></div>';
      summary.innerHTML = '';
      return;
    }
    let total = 0;
    el.innerHTML = cart.map(i => { total += i.price * i.quantity; return `<div class="cart-item"><div class="thumb">${emojiFor(i.category)}</div><div class="info"><div class="title">${esc(i.title)}</div><div class="price">${formatPrice(i.price)}</div><div class="cart-controls"><input type="number" min="1" value="${i.quantity}" onchange="updateQty(${i.id}, this.value)"> <button class="remove-btn" onclick="removeItem(${i.id})">Remove</button></div></div></div>` }).join('');
    summary.innerHTML = `<div class="row"><span>Subtotal</span><span>${formatPrice(total)}</span></div><div class="row"><span>Delivery</span><span>FREE</span></div><div class="row total"><span>Total</span><span>${formatPrice(total)}</span></div><div class="btn-group" style="margin-top:16px"><a href="/checkout.html" class="btn btn-orange" style="width:100%;text-align:center">Proceed to Buy</a></div>`;
  } catch (e) {
    if (/401|403/.test(e.message)) location.href = '/login.html';
    else alert(e.message);
  }
}
async function updateQty(id, q){ await cartApi.update(id, parseInt(q) || 1); load(); }
async function removeItem(id){ await cartApi.remove(id); load(); }
load();
</script>
</body>
</html>
