<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Amazon Clone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div id="nav"></div>
<main class="container main" style="max-width:460px">
  <div class="section">
    <h2 style="margin-bottom:18px">Forgot Your Password?</h2>
    <p class="helper">We'll send a password reset link to your email address (demo mode).</p>
    <form id="forgotForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" required placeholder="you@example.com">
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-orange" style="width:100%">Send Reset Link</button>
      </div>
      <div id="forgotMsg" class="helper" style="margin-top:12px"></div>
    </form>
    <p class="helper" style="margin-top:16px">Remember your password? <a href="/login.html">Sign in</a></p>
  </div>
</main>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
document.getElementById('forgotForm').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await authApi.forgot({ email: fd.get('email') });
    document.getElementById('forgotMsg').textContent = 'If an account exists with that email, a reset link has been sent.';
  } catch (e) {
    document.getElementById('forgotMsg').textContent = e.message;
    document.getElementById('forgotMsg').style.color = '#b12704';
  }
};
</script>
</body>
</html>
