<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Addresses | Amazon Clone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div id="nav"></div>
<main class="container main" style="max-width:700px">
  <h2 class="page-title">My Addresses</h2>
  <div class="section">
    <h3>Saved Addresses</h3>
    <div id="addrList"></div>
  </div>
  <div class="section" style="margin-top:16px">
    <h3>Add a New Address</h3>
    <form id="addrForm">
      <div class="form-row">
        <div class="form-group"><label>Type</label><select class="form-control" name="type"><option>Home</option><option>Work</option></select></div>
        <div class="form-group"><label>Name</label><input type="text" class="form-control" name="name" required></div>
      </div>
      <div class="form-group"><label>Street Address</label><input type="text" class="form-control" name="street" required></div>
      <div class="form-row">
        <div class="form-group"><label>City</label><input type="text" class="form-control" name="city" required></div>
        <div class="form-group"><label>State</label><input type="text" class="form-control" name="state" required></div>
        <div class="form-group"><label>Zip</label><input type="text" class="form-control" name="zip" required></div>
      </div>
      <div class="form-group"><label>Phone</label><input type="text" class="form-control" name="phone" required></div>
      <div class="btn-group"><button type="submit" class="btn btn-orange">Save Address</button></div>
      <div id="addrMsg" class="helper" style="margin-top:10px"></div>
    </form>
  </div>
</main>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }
async function load(){
  try { requireAuth(); } catch {}
  try {
    const { addresses } = await addressApi.list();
    const el = document.getElementById('addrList');
    if (!addresses.length) { el.innerHTML = '<div class="helper">No saved addresses.</div>'; return; }
    el.innerHTML = addresses.map(a => `<div style="border:1px solid #ddd;border-radius:4px;padding:12px;margin:10px 0;display:flex;justify-content:space-between"><div><b>${esc(a.type)}</b> - ${esc(a.name)}<br>${esc(a.street)}, ${esc(a.city)}, ${esc(a.state)} ${esc(a.zip)}<br>${esc(a.phone)}</div><div><button class="remove-btn" onclick="removeAddr(${a.id})">Delete</button>${a.is_default ? ' <span class="badge badge-processing">Default</span>' : ''}</div></div>`).join('');
  } catch (e) {
    if (/401|403/.test(e.message)) location.href = '/login.html';
    else alert(e.message);
  }
}
async function removeAddr(id){
  if (!confirm('Delete this address?')) return;
  await addressApi.remove(id);
  load();
}
document.getElementById('addrForm').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    await addressApi.add({ type: fd.get('type'), name: fd.get('name'), street: fd.get('street'), city: fd.get('city'), state: fd.get('state'), zip: fd.get('zip'), phone: fd.get('phone') });
    document.getElementById('addrMsg').textContent = 'Address saved!';
    document.getElementById('addrForm').reset();
    load();
  } catch (e) { document.getElementById('addrMsg').textContent = e.message; document.getElementById('addrMsg').style.color = '#b12704'; }
};
load();
</script>
</body>
</html>
