<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Amazon Clone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div id="nav"></div>
<main class="container main" style="max-width:460px">
  <div class="section">
    <h2 style="margin-bottom:18px">Create your Amazon account</h2>
    <form id="signupForm">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" name="password" required minlength="6">
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-orange" style="width:100%">Continue</button>
      </div>
      <div id="signupMsg" class="text-danger" style="margin-top:12px"></div>
    </form>
    <p class="helper" style="margin-top:16px">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>
</main>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
document.getElementById('signupForm').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const { token, user } = await authApi.register({ name: fd.get('name'), email: fd.get('email'), password: fd.get('password') });
    setSession(token, user);
    location.href = '/';
  } catch (e) {
    document.getElementById('signupMsg').textContent = e.message;
  }
};
</script>
</body>
</html>
