<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Amazon Clone</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="header"></div>
<div id="nav"></div>
<main class="container main" style="max-width:600px">
  <h2 class="page-title">Contact Us</h2>
  <div class="section">
    <h3>Customer Service</h3>
    <p>Email: support@amazonclone.demo</p>
    <p>Help topics: <a href="/help.html">Help &amp; Customer Service</a></p>
    <p>Returns: <a href="/returns.html">Return &amp; Refund Policy</a></p>
  </div>
  <div class="section" style="margin-top:20px">
    <h3>Send us a message (Demo)</h3>
    <form style="display:flex;flex-direction:column;gap:10px">
      <div class="form-group"><label>Name</label><input type="text" class="form-control" required></div>
      <div class="form-group"><label>Email</label><input type="email" class="form-control" required></div>
      <div class="form-group"><label>Message</label><textarea class="form-control" rows="4" required></textarea></div>
      <button type="submit" class="btn btn-orange">Send Message</button>
    </form>
    <p class="helper" style="margin-top:10px">This is a demo — messages are not actually sent.</p>
  </div>
</main>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
</body>
</html>
